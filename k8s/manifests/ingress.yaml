apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrmanager-ingress
  namespace: hrmanager
  labels:
    app.kubernetes.io/name: hrmanager
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kubectl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # Rate limiting — 100 req/s per IP
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Proxy timeouts for Next.js SSR
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # cert-manager TLS (comment out if not using cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hrmanager.example.com
      secretName: hrmanager-tls
  rules:
    - host: hrmanager.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hrmanager-svc
                port:
                  name: http
