apiVersion: v1
kind: ConfigMap
metadata:
  name: hrmanager-config
  namespace: hrmanager
  labels:
    app.kubernetes.io/name: hrmanager
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: kubectl
data:
  NODE_ENV: "production"
  # Auth.js v5 reads AUTH_URL (falls back to NEXTAUTH_URL).
  AUTH_URL: "https://hrmanager.example.com"
  # Run the pg-boss background workers in-process on this long-running deployment.
  WORKERS_ENABLED: "true"
  # Next.js performance tuning
  NEXT_TELEMETRY_DISABLED: "1"
