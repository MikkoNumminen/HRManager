{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hrmanager.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hrmanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    # WARNING: Rotate secrets via `helm upgrade --set secrets.data.*=<newvalue>`
    # or switch to an external secret manager (Vault, AWS Secrets Manager, etc.)
    helm.sh/resource-policy: keep
type: Opaque
# Values must be provided as plain strings — Helm will base64-encode them automatically.
# Pass via: --set secrets.data.DATABASE_URL='postgresql://...' or a separate values file.
stringData:
  {{- range $key, $val := .Values.secrets.data }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
