name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema to test database
        run: npx prisma db push --accept-data-loss

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # jest is transpile-only — without this gate, type errors only surface in
      # the Build step at the end (or worse, on Vercel). Fail fast here instead.
      - name: Type-check
        run: npm run typecheck

      # ErrorCode is a manual union; every member must have an errors.* i18n key
      # or `next build` fails. Catch the drift before the test suite runs.
      - name: Check error-code i18n coverage
        run: npm run check:error-codes

      # Feature-module boundary ratchet: fail if cross-feature `@/features/<other>`
      # imports drift from the baseline (convention → CI-enforced). See
      # scripts/check-feature-boundaries.mjs.
      - name: Check feature boundaries
        run: npm run check:boundaries

      # i18n parity is enforced locally by .husky/pre-push, but a --no-verify or
      # headless push skips that hook — mirror its thresholds here so the signal
      # always reaches CI. (Keep in sync with .husky/pre-push.)
      - name: Check i18n key parity
        run: |
          OUT=$(npx tsx scripts/i18n-sync.ts 2>&1) || true
          echo "$OUT"
          MISSING=$(echo "$OUT" | grep -c "^      + " || true)
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING missing i18n key(s). Run 'npm run i18n:fix', then translate, and commit."
            exit 1
          fi
          UNTRANSLATED=$(echo "$OUT" | grep "^Summary:" | sed -E 's/.*,[[:space:]]*([0-9]+) untranslated.*/\1/')
          if [ -n "$UNTRANSLATED" ] && [ "$UNTRANSLATED" -gt 25 ]; then
            echo "::error::$UNTRANSLATED untranslated i18n keys (threshold 25). Translate new keys with 'npm run i18n:translate'."
            exit 1
          fi
          echo "i18n OK — $(echo "$OUT" | grep '^Summary:')"

      # Playwright E2E (75 tests) intentionally stays out of CI: it needs a
      # production build + browsers (~10 min) and runs in the pre-release flow
      # instead (npm run test:e2e). Revisit if the suite gains CI budget.
      - name: Run all tests with coverage
        run: npm run test:all -- --coverage

      # The coverage run just wrote coverage/coverage-summary.json — fail if the
      # README's advertised coverage numbers have drifted from it.
      - name: Check README coverage claims
        run: npm run check:coverage-claims

      - name: Build
        run: npx next build
