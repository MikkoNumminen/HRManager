name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema to test database
        run: npx prisma db push --accept-data-loss

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run all tests with coverage
        run: npm run test:all -- --coverage

      - name: Build
        run: npx next build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test
      # Production-mode secrets (the e2e webServer runs `next build && next start`).
      AUTH_SECRET: e2e-ci-auth-secret-at-least-32-characters-long
      AUTH_URL: http://localhost:3000
      AUDIT_HMAC_SECRET: e2e-ci-audit-hmac-secret
      TOTP_ENCRYPTION_KEY: e2e-ci-totp-encryption-key
      NEXT_PUBLIC_DEMO_LOGIN: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer applies migrations via `npm run build`
      # (prisma migrate deploy), so no separate db push step is needed here.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
