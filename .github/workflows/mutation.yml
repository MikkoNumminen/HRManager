name: Mutation Testing

on:
  pull_request:
    branches:
      - main

# The score-comment step posts to the PR; without this the default token is read-only.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  mutation:
    name: Stryker Mutation Score
    runs-on: ubuntu-latest

    # Job-level so `npm ci`'s postinstall (`prisma generate`, which loads the Prisma 7
    # config that reads DATABASE_URL + DIRECT_URL) can resolve them — without this the
    # install fails. Mirrors ci.yml.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hrmanager_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push test schema
        run: npx prisma db push --accept-data-loss

      - name: Run Stryker mutation tests
        id: stryker
        run: npx stryker run
        env:
          # DATABASE_URL + DIRECT_URL come from the job-level env.
          MONGODB_URI: mongodb://localhost:27017/hrmanager_audit_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
        continue-on-error: true

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

      - name: Comment mutation score on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = '../actions/runs/${{ github.run_id }}';
            let body;
            try {
              // Compute the numeric mutation score from the JSON report so a
              // reader sees the digits, not just a link to the artifact.
              const jsonPath = 'reports/mutation/mutation.json';
              if (fs.existsSync(jsonPath)) {
                const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                let killed = 0, timeout = 0, survived = 0, noCov = 0;
                for (const file of Object.values(report.files || {})) {
                  for (const m of file.mutants || []) {
                    if (m.status === 'Killed') killed++;
                    else if (m.status === 'Timeout') timeout++;
                    else if (m.status === 'Survived') survived++;
                    else if (m.status === 'NoCoverage') noCov++;
                  }
                }
                const detected = killed + timeout;
                const valid = detected + survived + noCov;
                const score = valid ? (detected / valid) * 100 : 0;
                const pass = score >= 60;
                body = `### Mutation Testing\n\n**Score: ${score.toFixed(2)}%** ` +
                  `(break threshold 60% — ${pass ? '✅ pass' : '❌ below'}). ` +
                  `${detected} detected / ${valid} valid mutants ` +
                  `(killed ${killed}, timeout ${timeout}, survived ${survived}, no-coverage ${noCov}). ` +
                  `[Full report](${runUrl}).`;
              } else {
                body = `### Mutation Testing\n\nReport not generated (Stryker may have failed). [Logs](${runUrl}).`;
              }
            } catch (e) {
              body = `### Mutation Testing\n\nCould not read mutation report: ${e.message}`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if Stryker exited with error
        if: steps.stryker.outcome == 'failure'
        run: |
          echo "Stryker run failed or mutation score fell below the break threshold (60%)."
          exit 1
